name: Test
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Install dependencies
              run: npm install

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
